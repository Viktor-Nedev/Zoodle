name: Zoodle
description: "Приложение за спасяване на животни"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mapbox_maps_flutter: ^2.11.0
  geolocator: ^12.0.0
  google_nav_bar: ^5.0.6
  image_picker: ^1.1.0
  google_fonts: ^6.1.0
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  permission_handler: ^11.3.0
  table_calendar: ^3.1.0
  url_launcher: ^6.2.5
  intl: ^0.19.0
  camera: ^0.10.5+9
  google_generative_ai: ^0.4.7
  lottie: ^3.1.0
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.3.3
  async: ^2.11.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.0.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
